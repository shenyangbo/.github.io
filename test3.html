<!DOCTYPE >
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script type="text/javascript" src="js/jquery-2.1.1.min.js"></script>
		<title>简单录音页面 (PCM)</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				text-align: center;
				margin: 0;
				padding: 0;
			}

			button {
				margin: 20px;
				padding: 10px 20px;
				font-size: 16px;
				cursor: pointer;
				border: none;
				border-radius: 5px;
				background-color: #ffffff;
				color: #333333;
				transition: background-color 0.3s, color 0.3s;
			}

			button.recording {
				background-color: #3473F4;
				color: #ffffff;
			}

			button.cancel {
				background-color: red;
				color: #ffffff;
			}

			button:disabled {
				background-color: #cccccc;
				color: #666666;
				cursor: not-allowed;
			}

			audio {
				margin-top: 20px;
			}

			.toast {
				position: fixed;
				bottom: 20px;
				left: 50%;
				transform: translateX(-50%);
				background-color: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 10px 20px;
				border-radius: 5px;
				display: none;
			}
		</style>
	</head>
	<body>
		<h1>简单录音页面 (PCM)</h1>

		<!-- 播放录音 -->
		<div id="audioContainer"></div>

		<!-- 录音按钮 -->
		<button id="startRecording" style="background:red;width:160px;height:40px">长按</button>
		<div id="">

		</div>
		<!-- 录音按钮2 -->
		<button id="startRecording2">开始录音</button>
		<button id="stopRecording2">停止录音</button>

		<!-- Toast 提示 -->
		<div class="toast" id="toast"></div>

		<script>
			// 全局变量
			let audioContext;
			let mediaStreamSource;
			let scriptProcessorNode;
			let mergedBuffer = new Float32Array(0); // 存储 PCM 数据
			let isRecording = false;

			// 获取 DOM 元素
			const startButton = document.getElementById("startRecording");


			const toast = document.getElementById("toast");

			/**
			 * 显示 Toast 提示
			 * @param {string} message 提示信息
			 */
			function showToast(message) {
				toast.innerText = message;
				toast.style.display = 'block';

				// 设置定时器，使 Toast 在显示 2 秒后消失
				setTimeout(() => {
					toast.style.display = 'none';
				}, 2000);
			}

			/**
			 * 开始录音
			 */
			function resumeAudioContext() {
			    if (audioContext && audioContext.state === 'suspended') {
			        audioContext.resume().then(() => {
			            console.log("AudioContext resumed.");
			        });
			    }
			}
			
			async function startRecording() {
			    try {
			        // 如果已有 AudioContext，先关闭它
			        if (audioContext) {
			            await audioContext.close();
			            audioContext = null;
			        }
			
			        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
			
			        audioContext = new (window.AudioContext || window.webkitAudioContext)({
			            sampleRate: 48000,
			        });
			
			        console.log("实际采样率:", audioContext.sampleRate);
			
			        // 确保音频上下文处于活动状态
			        resumeAudioContext();
			
			        mediaStreamSource = audioContext.createMediaStreamSource(stream);
			        scriptProcessorNode = audioContext.createScriptProcessor(4096, 1, 1);
			        scriptProcessorNode.onaudioprocess = onAudioProcess;
			
			        mediaStreamSource.connect(scriptProcessorNode);
			        scriptProcessorNode.connect(audioContext.destination);
			
			        isRecording = true;
			
			        console.log('录音已开始');
			        showToast("录音已开始");
			        startButton.textContent = "松开结束";
			        startButton.classList.add("recording");
			    } catch (err) {
			        console.error('无法访问麦克风:', err);
			        alert(`麦克风访问失败: ${err.message}`);
			    }
			}

			/**
			 * 停止录音
			 */
		function stopRecording() {
		    if (!isRecording) return;
		
		    // 停止录音
		    isRecording = false;
		
		    // 停止 MediaStream 轨道
		    if (mediaStreamSource && mediaStreamSource.mediaStream) {
		        const tracks = mediaStreamSource.mediaStream.getTracks();
		        tracks.forEach(track => track.stop());
		    }
		
		    // 断开连接
		    if (scriptProcessorNode) {
		        scriptProcessorNode.disconnect();
		        mediaStreamSource.disconnect();
		    }
		
		    console.log('录音已停止');
		    showToast("录音完成");
		    startButton.textContent = "按住说话";
		    startButton.classList.remove("recording");
		
		    // 处理录音数据
		    processAudioData();
		}

			/**
			 * 音频处理回调
			 * @param {AudioProcessingEvent} event 音频处理事件
			 */
			function onAudioProcess(event) {
				if (!isRecording) return;

				// 获取输入缓冲区的第一个声道的数据
				const inputBuffer = event.inputBuffer.getChannelData(0);

				// 动态扩展 mergedBuffer 并追加新数据
				const newBuffer = new Float32Array(mergedBuffer.length + inputBuffer.length);
				newBuffer.set(mergedBuffer); // 复制已有数据
				newBuffer.set(inputBuffer, mergedBuffer.length); // 添加新数据
				mergedBuffer = newBuffer;
			}

			/**
			 * 处理录音数据并生成 WAV 文件
			 */
			function processAudioData() {
				if (mergedBuffer.length === 0) return;

				// 将浮点数 PCM 数据转换为 16-bit PCM 数据
				const pcmData = floatTo16BitPCM(mergedBuffer);

				// 将 PCM 数据封装为 WAV 文件
				const wavBlob = encodeWAV(pcmData, audioContext.sampleRate);

				// 创建音频 URL
				const audioUrl = URL.createObjectURL(wavBlob);

				// 创建音频元素
				const audioElement = document.createElement('audio');
				audioElement.controls = true; // 添加播放控件
				audioElement.src = audioUrl;

				// 插入音频到页面
				const audioContainer = document.getElementById('audioContainer');
				audioContainer.innerHTML = ''; // 清空之前的音频
				audioContainer.appendChild(audioElement);

				// 清空录音数据
				mergedBuffer = new Float32Array(0);
			}

			/**
			 * 将浮点数样本转换为 16-bit PCM 数据
			 * @param {Float32Array} input 输入的浮点数 PCM 数据
			 * @returns {Int16Array} 转换后的 16-bit PCM 数据
			 */
			function floatTo16BitPCM(input) {
				const output = new Int16Array(input.length);
				for (let i = 0; i < input.length; i++) {
					output[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF; // 转换为 16-bit PCM
				}
				return output;
			}

			/**
			 * 将 PCM 数据封装为 WAV 文件
			 * @param {Int16Array} samples PCM 数据
			 * @param {number} sampleRate 采样率
			 * @returns {Blob} WAV 文件 Blob 对象
			 */
			function encodeWAV(samples, sampleRate) {
				const bytesPerSample = 2; // PCM 16-bit
				const numChannels = 1;
				const blockAlign = numChannels * bytesPerSample;
				const byteRate = sampleRate * blockAlign;
				const dataSize = samples.length * bytesPerSample;

				// 创建一个 ArrayBuffer 来存储 WAV 文件头和音频数据
				const buffer = new ArrayBuffer(44 + dataSize);
				const view = new DataView(buffer);

				// 写入 WAV 文件头
				writeString(view, 0, 'RIFF'); // RIFF 标识符
				view.setUint32(4, 36 + dataSize, true); // 文件大小减去前 8 字节
				writeString(view, 8, 'WAVE'); // WAVE 标识符
				writeString(view, 12, 'fmt '); // fmt 子块标识符
				view.setUint32(16, 16, true); // fmt 子块大小（固定为 16）
				view.setUint16(20, 1, true); // PCM 格式
				view.setUint16(22, numChannels, true); // 声道数
				view.setUint32(24, sampleRate, true); // 采样率
				view.setUint32(28, byteRate, true); // 每秒字节数
				view.setUint16(32, blockAlign, true); // 块对齐
				view.setUint16(34, bytesPerSample * 8, true); // 每个样本的位数
				writeString(view, 36, 'data'); // data 子块标识符
				view.setUint32(40, dataSize, true); // 数据大小

				// 写入音频样本数据
				for (let i = 0; i < samples.length; i++) {
					view.setInt16(44 + i * 2, samples[i], true); // 写入每个样本
				}

				return new Blob([view], {
					type: 'audio/wav'
				});
			}

			/**
			 * 辅助函数：写入字符串到 DataView
			 * @param {DataView} view DataView 对象
			 * @param {number} offset 偏移量
			 * @param {string} string 要写入的字符串
			 */
			function writeString(view, offset, string) {
				for (let i = 0; i < string.length; i++) {
					view.setUint8(offset + i, string.charCodeAt(i));
				}
			}


			// 封装绑定点击事件的函数
			function bindClickEvent(selector, callback) {
				const $element = $(selector);

				// 检查是否已经绑定了事件，避免重复绑定
				if (!$element.data('hasEventListener')) {
					$element.on('click', callback);
					$element.data('hasEventListener', true); // 标记已绑定
					console.log(`Click event bound to the element: ${selector}`);
				} else {
					console.log(`Click event already bound for: ${selector}. Skipping...`);
				}
			}



			function initEvent() {
			    bindClickEvent('#startRecording2', startRecording);
			    bindClickEvent('#stopRecording2', stopRecording);
			
			    let startPosY = 0;
			
			    startButton.addEventListener("touchstart", (event) => {
			        event.preventDefault();
			        startPosY = event.touches[0].pageY;
			        startRecording(); // 直接调用录音逻辑
			    });
			
			    startButton.addEventListener("touchmove", (event) => {
			        event.preventDefault();
			
			        if (!isThrottled) {
			            isThrottled = true;
			            requestAnimationFrame(() => {
			                const currentPosY = event.touches[0].pageY;
			                const deltaY = startPosY - currentPosY;
			
			                if (deltaY > 40) {
			                    startButton.textContent = "松开手指，取消发送";
			                    startButton.classList.add("cancel");
			                } else {
			                    startButton.classList.remove("cancel");
			                }
			                isThrottled = false;
			            });
			        }
			    });
			
			    startButton.addEventListener("touchend", (event) => {
			        event.preventDefault();
			
			        const endPosY = event.changedTouches[0].pageY;
			        const deltaY = startPosY - endPosY;
			
			        if (deltaY > 40) {
			            showToast("取消发送");
			        } else {
			            stopRecording();
			        }
			
			        startButton.textContent = "按住说话";
			        startButton.classList.remove("recording");
			        startButton.classList.remove("cancel");
			    });
			}
			// 初始化事件监听器
			initEvent();
		</script>
	</body>
</html>
