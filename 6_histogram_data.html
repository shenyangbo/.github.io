<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="content-type" content="text/html;charset=utf-8" />

		<!--H5页面窗口自动调整到设备宽度，并禁止用户缩放页面-->
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, userscalable=no" />

		<!--当网站添加到主屏幕快速启动方式，可隐藏地址栏，仅针对ios的safari-->
		<meta content="yes" name="apple-mobile-web-app-capable">

		<!--将网站添加到主屏幕快速启动方式，仅针对ios的safari顶端状态条的样式-->
		<meta content="black" name="apple-mobile-web-app-status-bar-style">

		<!--忽略将页面中的数字识别为电话号码-->
		<meta content="telephone=no" name="format-detection">

		<!--忽略Android平台中对邮箱地址的识别-->
		<meta content="email=no" name="format-detection">
		<title>星卡自助伴</title>
		<link rel="stylesheet" type="text/css" href="css/css.css">
		<script type="text/javascript" src="js/jquery-2.1.1.min.js"></script>
		<script src="js/js.js"></script>
		<link rel="stylesheet" href="js/swiper-bundle.min.css" />
		<script src="js/swiper-bundle.min.js"></script>
	</head>
	<body>
		<!-- 六个月流量使用情况 -->
		<div class="histogram_container">
			<div class="data_title">
				<img src="image/ic_syqk.png" alt="" />
				<p>近6个月流量使用情况</p>
			</div>
			<div class="histogram">
				<div class="histogram_item">
					<div>
						<span>5.32GB</span>
						<p style="height: 53.2%;"></p>
						3月
					</div>
					<div>
						<span>6.80GB</span>
						<p style="height: 68%;"></p>
						4月
					</div>
					<div>
						<span>4.05GB</span>
						<p style="height: 40.5%;"></p>
						5月
					</div>
					<div>
						<span>8.86GB</span>
						<p style="height: 88.6%;"></p>
						6月
					</div>
					<div>
						<span>5.32GB</span>
						<p style="height: 53.2%;"></p>
						7月
					</div>
					<div>
						<span>5.32GB</span>
						<p style="height: 53.2%;"></p>
						8月
					</div>
				</div>
				<div class="raster">
					<span></span>
					<span></span>
					<span></span>
					<span></span>
					<span></span>
				</div>
			</div>
			<div class="average">
				<span></span>平均流量3.62GB/月
			</div>
			<p class="histogram_details">(点击柱状图显示详情)</p>
		</div>
	</body>
</html>
