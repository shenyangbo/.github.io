<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="content-type" content="text/html;charset=utf-8" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<title>产品功能</title>
		<script type="text/javascript" src="js/jquery-2.1.1.min.js"></script>
		<style>
			:root {
				--primary-color: #3473F4;
				--primary-light: #F4F8FF;
				--text-main: #1D1D1D;
				--text-sub: #86868B;
				--card-radius: 8px;
				--ease-breathe: cubic-bezier(0.23, 1, 0.32, 1);
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}

			/* 完全对齐15_balance的body样式 */
			body {
				background: #FFFFFF;
				font-family: -apple-system, sans-serif;
				color: var(--text-main);
			}

			/* --- 顶部用户信息 保留原有内容 --- */
			.user-header {
				padding: 12px 8px 8px;
				font-size: 15px;
				color: #444;
			}

			.user-header span {
				color: var(--primary-color);
				font-weight: 600;
			}

			/* --- 完全复用15_balance的tab导航样式 --- */
			.balance_tab-links {
				display: flex;
				position: fixed;
				top: 0;
				left: 0;
				z-index: 999;
				width: 100%;
				background: rgba(52, 115, 244, 0.9);
				backdrop-filter: blur(20px);
				-webkit-backdrop-filter: blur(20px);
				border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
			}

			.balance_tab-links li {
				flex: 1;
				display: flex;
				flex-direction: column;
				padding: 8px 0 4px 0;
				align-items: center;
				cursor: pointer;
			}

			.balance_tab-links a {
				font-size: 14px;
				color: #ffffff;
				text-decoration: none;
			}

			.balance_active {
				width: 16px;
				height: 3px;
				border-radius: 3px;
				background: #ffffff;
				margin-top: 5px;
				opacity: 0;
				transform: scaleX(0);
				transition: 0.4s var(--ease-breathe);
			}

			.balance_tab_active .balance_active {
				opacity: 1;
				transform: scaleX(1);
			}

			/* 完全复用15_balance的tab容器样式 */
			.balance_tabs {
				padding-top: 40px;
			}

			.tab {
				display: none;
				animation: breatheIn 0.6s var(--ease-breathe) forwards;
			}

			.tab.active {
				display: block;
			}

			@keyframes breatheIn {
				0% {
					opacity: 0;
					transform: translateY(10px);
				}

				100% {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* --- 内容区域 保留原有功能列表样式 --- */
			.tab-container {
				padding: 8px;
				background: #ffffff;
			}

			.function-list {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}

			.function-item {
				background: #f0f8ff;
				padding: 8px 8px;
				border-radius: var(--card-radius);
				display: flex;
				align-items: center;
				box-shadow: 0 4px 12px rgba(52, 115, 244, 0.04);
				transition: transform 0.2s;
			}

			.function-item:active {
				transform: scale(0.98);
			}

			

			.function-name {
				font-size: 14px;
				font-weight: 500;
				color: #666666;
				flex: 1;
				display: flex;
				align-items: center;
			}
			.function-name  img {
				width: 24px;
				height: 24px;
			}

			/* 底部装饰 */
			.footer-note {
				text-align: center;
				color: var(--text-sub);
				font-size: 12px;
				margin-top: 30px;
				padding-bottom: 20px;
			}
		</style>
	</head>
	<body>
		<!-- 完全复用15_balance的tab外层容器结构 -->
		<div class="balance_tabs">
			<!-- 完全复用15_balance的tab栏标签结构 -->
			<ul class="balance_tab-links">
				<li class="balance_tab_active" data-target="#base">
					<a href="javascript:void(0)">基础功能</a>
					<span class="balance_active"></span>
				</li>
				<li data-target="#control">
					<a href="javascript:void(0)">程控功能</a>
					<span class="balance_active"></span>
				</li>
			</ul>

			<!-- 完全复用15_balance的内容外层标签结构 -->
			<div class="balance_tab-content">
				<!-- 替换为产品功能内容，标签对齐15_balance的.tab -->
				<div id="base" class="tab active">
					<div class="tab-container">
						<div class="function-list">
							<div class="function-item">
								<div class="function-name"><img src="image/ic_func_data.png" alt="" />上网功能</div>
							</div>
							<div class="function-item">
								<div class="function-name"><img src="image/ic_func_yuyin.png" alt="" />市话/国内长途/国际及港澳台</div>
							</div>
							<div class="function-item">
								<div class="function-name"><img src="image/ic_func_message.png" alt="" />短信功能</div>
							</div>
						</div>
					</div>
				</div>

				<div id="control" class="tab">
					<div class="tab-container">
						<div class="function-list">
							<div class="function-item">
								<div class="function-name"><img src="image/ic_func_cli.png" alt="" />来电显示</div>
							</div>
							<div class="function-item">
								<div class="function-name"><img src="image/ic_func_transfer.png" alt="" />呼叫转移</div>
							</div>
							<div class="function-item">
								<div class="function-name"><img src="image/ic_func_waiting.png" alt="" />呼叫等待</div>
							</div>
							<div class="function-item">
								<div class="function-name"><img src="image/ic_func_data.png" alt="" />三方通话</div>
							</div>
							<div class="function-item">
								<div class="function-name"><img src="image/ic_func_music.png" alt="" />七彩铃音/视频彩铃</div>
							</div>
							<div class="function-item">
								<div class="function-name"><img src="image/ic_func_volter.png" alt="" />VoLTE业务</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script>
			$(document).ready(function() {
				// 完全复用15_balance的Tab切换逻辑
				$('.balance_tab-links li').on('click', function() {
					if ($(this).hasClass('balance_tab_active')) return;
					$('.balance_tab-links li').removeClass('balance_tab_active');
					$(this).addClass('balance_tab_active');
					$('.tab.active').hide().removeClass('active');
					$($(this).data('target')).show().addClass('active');
				});
			});
		</script>
	</body>
</html>
