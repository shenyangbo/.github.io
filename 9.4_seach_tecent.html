<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="content-type" content="text/html;charset=utf-8" />

		<!--H5页面窗口自动调整到设备宽度，并禁止用户缩放页面-->
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, userscalable=no" />

		<!--当网站添加到主屏幕快速启动方式，可隐藏地址栏，仅针对ios的safari-->
		<meta content="yes" name="apple-mobile-web-app-capable">

		<!--将网站添加到主屏幕快速启动方式，仅针对ios的safari顶端状态条的样式-->
		<meta content="black" name="apple-mobile-web-app-status-bar-style">

		<!--忽略将页面中的数字识别为电话号码-->
		<meta content="telephone=no" name="format-detection">

		<!--忽略Android平台中对邮箱地址的识别-->
		<meta content="email=no" name="format-detection">
		<title>星卡自助伴</title>
		<link rel="stylesheet" type="text/css" href="css/css.css">
		<script type="text/javascript" src="js/jquery-2.1.1.min.js"></script>
		<script src="js/js.js"></script>
		<link rel="stylesheet" href="js/swiper-bundle.min.css" />
		<script src="js/swiper-bundle.min.js"></script>
	</head>
	<body>
		<div class="home_container">

			<div class="search_content" id="content">
				<div class="search_item">
					<p class="search_item_title">
						<img src="image/ic_app_tengxun.png" alt="">腾讯系
					</p>
					<div class="search_item_subproject">
						<p class="subproject_title">
							<span class="dot_red"></span>
							腾讯视频定向流量范围：

						</p>
						<p class="subproject_details">流量在使用时，不区分网络方式，通过腾讯客户端观看腾讯视频等相关内容产生的流量不收费。
						</p>
					</div>
					<div class="search_item_subproject">
						<p class="subproject_title">
							<span class="dot_red"></span>
							定向流量不包含以下使用范围:
						</p>
						<p class="subproject_details">
							1、腾讯客户端内其它图片（视频缩略图除外）、文字、弹幕加载，上传及下载视频；打开登录腾讯视频时加载图片、文字；直播、APP视频通话等产生的流量。<br>
							2、第三方广告，在线观看、下载、缓存。<br>
							3、在无线上网卡、移动WIFI、MIFI、平板电脑（如iPad）等设备使用。<br>
							4、手机号码作为手机热点使用。
						</p>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
