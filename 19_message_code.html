<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		
		<!--H5页面窗口自动调整到设备宽度，并禁止用户缩放页面-->
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, userscalable=no" />
		
		<title>星卡自助伴</title>
		<link rel="stylesheet" type="text/css" href="css/css.css">
		<script type="text/javascript" src="js/jquery-2.1.1.min.js"></script>
		<style type="text/css">
			.message_title{
				color: #ffffff;
				display: flex;
				align-items: center;
				width: 100%;
				gap: 4px;
				font-size: 16px;
			}
			.message_title img{
				width: 28px;
				border: 1px solid rgba(255, 255, 255, 0.6);
				border-radius:8px;
			}
			.verify_password{
				background: linear-gradient(135deg,#AEB5FF,#72A0FF);
				padding:16px 8px 8px;
				border-radius: 8px;
				gap: 8px;
			}
			.password_container{
				background: #ffffff;
				width: 100%;
				padding:16px 8px;
				border-radius: 8px;
				display: flex;
				flex-direction: column;
				gap: 16px;
			}
			.button_large{
				background: linear-gradient(90deg,#9679FF,#5D92FF);
				border-radius: 22px;
			}
			.button_large:active{
				/* background: ; */
				opacity: 0.9 !important;
			}
			.password_content span{
				width: auto;
			}
			.verify_code{
				font-size: 16px;
			}
			.input_container{
				flex: 1;
				display: flex;
			}
			.input_container input{
				border-bottom: 1px solid #EEEEEE;
				    font-size: 16px;
				    color: #333333;
				    margin-left: 16px;
				    line-height: 44px;
					width: 100%;
			}
		</style>
	</head>
	<body>
		<div class="verify_password">
			<p class="message_title">
				<img src="image/ic_verify_code.png" alt="" />
				<span>办理手机紧急复通需验证短信验证码</span>
			</p>
			<div class="password_container">
				<div class="password_content">
					<span>短信验证码</span>
					<div class="input_container">
						<input type="text" maxlength="6" style="flex: 1;" placeholder="请输入短信验证码"/>
					</div>
					
					
					<button type="button" class="verify_code" id="verify_code">获取验证码</button>
				</div>
				<p class="verfy_error">请输入正确短信验证码</p>
				<!-- 失败样例 -->
				<button class="button_large wrong">立即验证</button>
				<!-- 成功样例 -->
				<button class="button_large right" style="display: none;">立即验证</button>
			</div>
			
			<div class="toast" id="toast"></div>
			
		</div>
	</body>
	<script>
		let baseHeight = $(document).height();
		let isErrorMessageShown = false;
		
		function sendHeight() {
		  let h = baseHeight;
		  if (isErrorMessageShown) {
		    h += 20;
		  }
		  console.log('发送高度:', h);
		  window.parent.postMessage({ type: 'resize', height: h }, '*');
		}
		
		$('.button_large').on('click', function(){
		  $('.verfy_error').show();
		  isErrorMessageShown = true;
		  sendHeight();
		});
		
		$(sendHeight); // 初始发送
		
		$('.input_container').on('input', function() {
			$('.verfy_error').hide();
			isErrorMessageShown = false;
			sendHeight();
		});
		
		$(document).on('click','#verify_code',function(){
			$('#verify_code').attr('disabled','disabled');
			var box = document.getElementById('verify_code');
			box.style.color = '#999999'
			var num = 60;
			var T = setInterval(function(){
			    box.innerHTML ='重新获取'+  --num + 's';
			    if(num <= 0  ){
			        clearInterval(T);
					$('#verify_code').removeAttr('disabled')  //60秒后去除disabled样式
					$('#verify_code').text('重新发送');
					box.style.color = '#3473F4'
			    }
			}, 1000);
			
		})
		
		$('.wrong').click(function(){
			$('.verfy_error').show()
		})
		$('.right').click(function(){
			const toast = document.getElementById("toast");
			toast.innerText ='验证成功';
			toast.style.display = 'block';
			setTimeout(() => {
				toast.style.display = 'none';
			}, 1000);
		})
		
		$('.input_container').on('input', function() {
			$('.verfy_error').css('display', 'none');
		});
		
	</script>
</html>
